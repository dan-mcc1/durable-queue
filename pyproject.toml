[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durable-queue"
version = "0.1.0"
description = "A durable, Postgres-backed job queue library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
durable-queue = "durable_queue.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_queue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
